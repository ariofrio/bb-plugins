name: Thread tasks

on:
  push:
    paths:
      - "plugins/bb-plugin-thread-tasks/**"
      - ".github/workflows/thread-tasks.yml"
  pull_request:
    paths:
      - "plugins/bb-plugin-thread-tasks/**"
      - ".github/workflows/thread-tasks.yml"

jobs:
  release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/bb-plugin-thread-tasks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/bb-plugin-thread-tasks/package-lock.json
      - run: npm ci
      - run: npm run release:check
